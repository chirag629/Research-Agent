[project]
name = "research-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "markdown>=3.11.3",
    "openai>=3.57.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pymupdf>=2.1",
    "pypdf>=7.1.1",
    "pytest>=9.2.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.6",
    "sqlalchemy>=2.1.9",
    "trafilatura>=2.4.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
research-agent = "research_agent:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
